name: Build and release Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build Windows installer
        env:
          APP_VERSION: 1.${{ github.run_number }}.0
        run: ./gradlew packageMsi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}.0"
          cp build/compose/binaries/main/msi/*.msi "ProvisionStore-${TAG}.msi"
          gh release create "$TAG" "ProvisionStore-${TAG}.msi" --title "Provision Store Desktop ${TAG}" --generate-notes
